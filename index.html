
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPCET Academic Record Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #eef2f6;
      }
      .academic-font {
        font-family: 'Crimson Text', serif;
      }
      /* Custom shadow for book depth */
      .book-shadow {
        box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.4);
      }
      /* Paper texture overlay */
      .paper-texture {
        background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
      }
      /* Hide scrollbar but allow scrolling */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      .perspective-2000 {
        perspective: 2000px;
      }

      /* Realistic Page Turn Animation */
      @keyframes flip-right-to-left {
        0% { transform: rotateY(0deg) translateX(0); z-index: 50; }
        50% { transform: rotateY(-90deg) translateX(-10px) scale(1.02); }
        100% { transform: rotateY(-180deg) translateX(0); z-index: 0; }
      }

      @keyframes flip-left-to-right {
        0% { transform: rotateY(-180deg) translateX(0); z-index: 50; }
        50% { transform: rotateY(-90deg) translateX(10px) scale(1.02); }
        100% { transform: rotateY(0deg) translateX(0); z-index: 0; }
      }

      .turning-right {
        animation: flip-right-to-left 0.8s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
        transform-origin: left;
        backface-visibility: hidden;
      }

      .turning-left {
        animation: flip-left-to-right 0.8s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
        transform-origin: right;
        backface-visibility: hidden;
      }

      /* Curl shadow effect */
      .page-curl-shadow {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100px;
        pointer-events: none;
        z-index: 60;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .is-turning .page-curl-shadow {
        opacity: 1;
      }

      .shadow-right {
        right: 0;
        background: linear-gradient(to left, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 100%);
      }

      .shadow-left {
        left: 0;
        background: linear-gradient(to right, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 100%);
      }

      input:focus {
        background-color: #f0f9ff;
      }
    </style>
